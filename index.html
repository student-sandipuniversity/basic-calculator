
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">
    <header class="header">
      <h1>Calculator</h1>
      <p>Simple & Smart</p>
    </header>

    <section class="display" aria-label="Calculator display">
      <div id="expression" class="expression" aria-live="polite">
        Ready to calculate
      </div>
      <div id="screen" class="screen" aria-live="polite"
           aria-atomic="true">0</div>
    </section>

    <section class="buttons" aria-label="Calculator buttons">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="backspace"
              aria-label="Backspace">⌫</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button data-action="sign">+/−</button>
      <button data-value="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>

    <p class="keyboard-help">
      Keyboard: 0–9, +, −, *, /, Enter, Backspace, Esc
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
